<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eager Poker</title>
<style>
  body{font-family:sans-serif;background:#0b3d2e;color:#fff;margin:0;padding:20px;text-align:center}
  input,button{display:block;width:100%;max-width:320px;margin:10px auto;padding:12px;font-size:16px;border-radius:8px;border:0;box-sizing:border-box}
  button{background:#f4b400;font-weight:bold}
  #msg{margin-top:15px;min-height:24px}
  .bar{max-width:320px;margin:0 auto 10px;display:flex;justify-content:space-between;font-weight:bold}
  .carte{max-width:320px;margin:10px auto;padding:12px;background:#145a43;border-radius:10px;text-align:left}
  .carte h3{margin:0 0 6px}
  .carte small{color:#cde}
  .carte button{margin:10px 0 0;max-width:none}
  .quitter{background:#c0392b;color:#fff}
  .gris{background:#8aa;color:#022}
  .felt{max-width:340px;margin:10px auto;background:#1b7a4f;border:6px solid #5a3a1a;border-radius:40px;padding:14px}
  .centre{margin:0 0 12px;padding:12px;background:#145a43;border-radius:14px}
  .cartes{display:flex;justify-content:center;gap:6px;margin-top:8px}
  .cartes span{width:42px;height:58px;border:2px dashed #7fc;border-radius:6px;box-sizing:border-box}
  .seats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .siege{background:#0e3b2a;border-radius:10px;padding:10px;min-height:64px;text-align:left}
  .siege.moi{outline:3px solid #f4b400}
  .siege.vide{opacity:.4}
  .siege b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<h1>♠ Eager Poker ♥</h1>

<div id="formulaire">
  <input id="email" type="email" placeholder="E-mail">
  <input id="mdp" type="password" placeholder="Mot de passe (6 caractères min.)">
  <button id="btnEntrer">Se connecter</button>
  <button id="btnCreer">Créer un compte</button>
</div>

<div id="lobby" style="display:none">
  <div class="bar"><span id="pseudo"></span><span id="jetons"></span></div>
  <h2>Créer une table</h2>
  <input id="nomTable" type="text" maxlength="30" placeholder="Nom de la table">
  <button id="btnTable">Créer la table</button>
  <h2>Tables ouvertes</h2>
  <div id="liste"></div>
  <button id="btnSortir" class="quitter">Se déconnecter</button>
</div>

<div id="tableView" style="display:none">
  <h2 id="titreTable"></h2>
  <div class="felt">
    <div class="centre">
      <div>Pot : <b id="pot">0</b></div>
      <div class="cartes"><span></span><span></span><span></span><span></span><span></span></div>
    </div>
    <div class="seats" id="sieges"></div>
  </div>
  <button id="btnRetour" class="gris">← Retour au lobby</button>
  <button id="btnQuitterTable" class="quitter">Quitter la table</button>
</div>

<div id="msg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, onSnapshot, collection, addDoc, query, orderBy, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDXyNNGTWwifena8SSHqvwqyAno0S9vRAM",
  authDomain: "eager-poker.firebaseapp.com",
  projectId: "eager-poker",
  storageBucket: "eager-poker.firebasestorage.app",
  messagingSenderId: "755914114241",
  appId: "1:755914114241:web:32712cbaee6d2a2163c040"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const msg = t => $("msg").textContent = t;

let tableCourante = null;
let stopUser = null, stopTables = null, stopTable = null;

function montrerLobby() {
  if (stopTable) { stopTable(); stopTable = null; }
  tableCourante = null;
  $("tableView").style.display = "none";
  $("lobby").style.display = "block";
}

function ouvrirTable(id) {
  tableCourante = id;
  $("lobby").style.display = "none";
  $("tableView").style.display = "block";
  if (stopTable) stopTable();
  stopTable = onSnapshot(doc(db, "tables", id), snap => {
    if (!snap.exists()) { montrerLobby(); msg("Cette table n'existe plus."); return; }
    dessinerTable(snap.data());
  }, e => msg("Erreur : " + e.code));
}

function dessinerTable(t) {
  $("titreTable").textContent = t.name;
  $("pot").textContent = t.pot || 0;
  const sieges = $("sieges");
  sieges.textContent = "";
  const joueurs = t.players || [];
  for (let i = 0; i < t.maxPlayers; i++) {
    const p = joueurs[i];
    const s = document.createElement("div");
    s.className = "siege";
    if (!p) {
      s.classList.add("vide");
      s.textContent = "Siège libre";
    } else {
      if (p.uid === auth.currentUser.uid) s.classList.add("moi");
      const nom = document.createElement("b");
      nom.textContent = p.name + (p.uid === auth.currentUser.uid ? " (toi)" : "");
      const jetons = document.createElement("div");
      jetons.textContent = typeof p.stack === "number" ? "🪙 " + p.stack : "🪙 —";
      s.append(nom, jetons);
    }
    sieges.appendChild(s);
  }
}

$("btnCreer").onclick = async () => {
  try { await createUserWithEmailAndPassword(auth, $("email").value, $("mdp").value); msg(""); }
  catch (e) { msg("Erreur : " + e.code); }
};
$("btnEntrer").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value, $("mdp").value); msg(""); }
  catch (e) { msg("Erreur : " + e.code); }
};
$("btnSortir").onclick = () => signOut(auth);

$("btnTable").onclick = async () => {
  const nom = $("nomTable").value.trim();
  if (!nom) { msg("Donne un nom à la table."); return; }
  try {
    await addDoc(collection(db, "tables"), {
      name: nom,
      owner: auth.currentUser.uid,
      maxPlayers: 6,
      smallBlind: 10,
      bigBlind: 20,
      pot: 0,
      players: [],
      createdAt: serverTimestamp()
    });
    $("nomTable").value = "";
    msg("");
  } catch (e) { msg("Erreur : " + e.code); }
};

async function rejoindre(id, pseudo) {
  try {
    const u = await getDoc(doc(db, "users", auth.currentUser.uid));
    const stack = u.exists() ? u.data().chips : 1000;
    await updateDoc(doc(db, "tables", id), {
      players: arrayUnion({ uid: auth.currentUser.uid, name: pseudo, stack: stack })
    });
    msg("");
    ouvrirTable(id);
  } catch (e) { msg("Erreur : " + e.code); }
}

async function quitter(id) {
  try {
    const ref = doc(db, "tables", id);
    const snap = await getDoc(ref);
    const reste = (snap.data().players || []).filter(p => p.uid !== auth.currentUser.uid);
    await updateDoc(ref, { players: reste });
    if (tableCourante === id) montrerLobby();
  } catch (e) { msg("Erreur : " + e.code); }
}

$("btnRetour").onclick = () => montrerLobby();
$("btnQuitterTable").onclick = () => { if (tableCourante) quitter(tableCourante); };

function afficherTables(snap, user, pseudo) {
  const liste = $("liste");
  liste.textContent = "";
  if (snap.empty) { liste.textContent = "Aucune table pour l'instant. Crée la première !"; return; }
  snap.forEach(d => {
    const t = d.data();
    const joueurs = t.players || [];
    const dedans = joueurs.some(p => p.uid === user.uid);
    const carte = document.createElement("div");
    carte.className = "carte";

    const titre = document.createElement("h3");
    titre.textContent = t.name;
    const info = document.createElement("small");
    info.textContent = joueurs.length + "/" + t.maxPlayers + " joueurs · blinds " + t.smallBlind + "/" + t.bigBlind;
    const noms = document.createElement("div");
    noms.textContent = joueurs.length ? joueurs.map(p => p.name).join(", ") : "Table vide";
    carte.append(titre, info, noms);

    if (dedans) {
      const ouvrir = document.createElement("button");
      ouvrir.textContent = "Ouvrir la table";
      ouvrir.onclick = () => ouvrirTable(d.id);
      const sortir = document.createElement("button");
      sortir.textContent = "Quitter la table";
      sortir.className = "quitter";
      sortir.onclick = () => quitter(d.id);
      carte.append(ouvrir, sortir);
    } else {
      const bouton = document.createElement("button");
      if (joueurs.length >= t.maxPlayers) {
        bouton.textContent = "Table pleine";
        bouton.disabled = true;
      } else {
        bouton.textContent = "Rejoindre";
        bouton.onclick = () => rejoindre(d.id, pseudo);
      }
      carte.append(bouton);
    }
    liste.appendChild(carte);
  });
}

onAuthStateChanged(auth, async user => {
  if (stopUser) { stopUser(); stopUser = null; }
  if (stopTables) { stopTables(); stopTables = null; }
  if (stopTable) { stopTable(); stopTable = null; }
  tableCourante = null;
  $("tableView").style.display = "none";

  $("formulaire").style.display = user ? "none" : "block";
  $("lobby").style.display = user ? "block" : "none";
  if (!user) return;

  const pseudo = user.email.split("@")[0];
  $("pseudo").textContent = pseudo;

  const ref = doc(db, "users", user.uid);
  try {
    const snap = await getDoc(ref);
    if (!snap.exists()) {
      await setDoc(ref, { email: user.email, name: pseudo, chips: 1000, createdAt: serverTimestamp() });
    }
  } catch (e) { msg("Erreur : " + e.code); }

  stopUser = onSnapshot(ref, s => {
    if (s.exists()) $("jetons").textContent = "🪙 " + s.data().chips + " jetons";
  });

  stopTables = onSnapshot(
    query(collection(db, "tables"), orderBy("createdAt", "desc")),
    snap => afficherTables(snap, user, pseudo),
    e => msg("Erreur : " + e.code)
  );
});
</script>
</body>
</html>
